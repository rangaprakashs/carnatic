nochrome":""},{"productId":"472057","productName":"Cubase Pro 15","color":"","monochrome":""}],"familyLogo":{"color":"https://ocl-steinberg-live.steinberg.net/_storage/asset/66148/storage/master/Cubase-generic-500px-color.svg","monochrome":"https://ocl-steinberg-live.steinberg.net/_storage/asset/66147/storage/master/Cubase-generic-500px-black.svg"},"generationLogo":{"color":"","monochrome":""}},"theme":{"schema":"cubase-13","color":"bright"},"route":"/cubase/release-notes/13/","page":{"content":[{"type":"steinberg--text-media","variant":"intro","id":"271020","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h1","content":"Cubase 13 Release Notes"}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"592423","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h1","content":"Cubase 13.0.55"},{"name":"headline","type":"h3","content":"What’s new?"},{"name":"text","type":"regular","content":"March 26, 2025 – The Cubase 13.0.55 maintenance update is immediately available for download via the Steinberg Download Assistant."},{"name":"headline","type":"h3","content":"New MIDI Remote Scripts"},{"name":"text","type":"answer","content":"Two additional MIDI Remote scripts have been added and are now automatically available for the following devices:"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Donner DMK-25 Pro"},{"name":"text","type":"normal","content":"Novation LaunchKey MK4 Series"}]}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"476887","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h1","content":"Cubase 13.0.51"},{"name":"headline","type":"h3","content":"What’s new?"},{"name":"text","type":"regular","content":"December 4, 2024 – The Cubase 13.0.51 maintenance update is now available. This update addresses multiple issues with the MIDI Remote functionality and resolves a stability issue that occurred in projects with numerous automation tracks under high system load."},{"name":"text","type":"regular","content":"The update is immediately available for download via the Steinberg Download Assistant."}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"437333","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Cubase 13.0.50"},{"name":"headline","type":"h3","content":"What’s new?"},{"name":"text","type":"regular","content":"October 24, 2024 – The Cubase 13.0.50 maintenance update is now available. This update introduces numerous fixes and improvements across various areas of the application. In addition to our usual platforms, you can now access a preview version of Cubase 13.0.50 for Windows on Arm CPUs."},{"name":"text","type":"regular","content":"The update is immediately available for download via the Steinberg Download Assistant."},{"name":"headline","type":"h3","content":"Preview Version of Cubase for Windows on Arm CPUs"},{"name":"text","type":"regular","content":"We are excited to announce the release of a preview version of Cubase for Windows on Arm CPUs. This preview has been specifically tested on devices powered by Qualcomm’s Snapdragon® X Elite processors and allows users to run Cubase natively on these systems for the first time."},{"name":"text","type":"regular","content":"Please note that this is a preview version that has not yet been fully optimized. As such, it may not offer the same level of stability and performance as our currently supported platforms. While it has undergone extensive testing, there are still known issues that must be resolved. Be aware that you may experience occasional bugs and limitations with this version."},{"name":"text","type":"regular","content":"We greatly value your feedback during this preview period and are committed to improving the user experience with future updates. Our goal is to release a fully supported version for Windows on Arm in early 2025, ensuring the same level of quality and performance that Cubase users expect on all platforms."},{"name":"text","type":"regular","content":"The Windows on Arm application installers are available from the Steinberg Download Assistant (SDA) in the category “Complementary Products”, as well as in the [link href=\"https://o.steinberg.net/en/support/downloads.html\" target=\"_self\" url-fragment=\"\" seoTitle=\"\" follow=\"follow\"]Steinberg Support download section.[/link]"},{"name":"text","type":"regular","content":"A preview of the Yamaha Steinberg USB Driver for Windows on Arm is also available at the same locations."},{"name":"text","type":"regular","content":"Additionally, we have created a dedicated tag for Windows on Arm in the [link href=\"https://forums.steinberg.net/tag/windows-on-arm\" target=\"_self\" url-fragment=\"\" seoTitle=\"\" follow=\"follow\"]Steinberg Forums[/link], and we encourage you to share your experiences and feedback regarding this new platform."},{"name":"text","type":"regular","content":"Thank you for your continued support as we expand our software to new platforms and push the boundaries of creativity across diverse computing environments."},{"name":"headline","type":"h3","content":"We have improved the following features and functionality:"},{"name":"headline","type":"h3","content":"Miscellaneous"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Editing the Root Note on the Info Line for Scale Events now works as expected."},{"name":"text","type":"normal","content":"We have added [MB1] new user interface elements for managing Snapshots on MIDI Device Panels."},{"name":"text","type":"normal","content":"Trim & Downmix controls now correctly affect beds in the Renderer for Dolby Atmos."},{"name":"text","type":"normal","content":"We have optimized the compatibility for importing decoded DolbyE .wav files."},{"name":"text","type":"normal","content":"After using Undo for “Track Operation: Folder: Toggle” in the Event Transform Actions list of the Project Logical Editor, folders now expand/collapse as expected."},{"name":"text","type":"normal","content":"We have improved the filtering by signature attribute in the MediaBay."},{"name":"text","type":"normal","content":"When enabling Mute on tracks containing MIDI Parts, “Chase Events” data is now sent as expected."},{"name":"text","type":"normal","content":"We have optimized the performance for projects using large amounts of Post Fader Sends."},{"name":"text","type":"normal","content":"We have enhanced the font in the Time module of SuperVision in Beats mode, to improve display stability and to reduce unsteadiness."}]},{"name":"headline","type":"h3","content":"MixConsole"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Removing a track with active side-chain routing and then undoing the removal now properly restores the side-chain routing."},{"name":"text","type":"normal","content":"Working with Link Groups in the Lower Zone MixConsole is now accurately reflected on the user interface when only Inserts or Sends are displayed, instead of Faders."},{"name":"text","type":"normal","content":"Copy/Paste of MixConsole EQ settings now works reliably."},{"name":"text","type":"normal","content":"We have resolved a graphical glitch in Send slots that occurred when double-clicking a slot to enter values."}]},{"name":"headline","type":"h3","content":"Video"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"We have improved the compatibility for importing Video files with variable frame rates."},{"name":"text","type":"normal","content":"We have resolved an issue where exporting video sometimes led to shifted colors."},{"name":"text","type":"normal","content":"We have resolved an issue where exporting video with uncommon aspect ratios was not working as expected."}]},{"name":"headline","type":"h3","content":"Stability"},{"name":"text","type":"regular","content":"We have improved stability in the following areas:"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"when working with the Editor Visibility List within the Key/Drum Editor."},{"name":"text","type":"normal","content":"when editing SMF Events with active Note Expression MIDI Input in the List Editor."},{"name":"text","type":"normal","content":"when attempting to use \"Set Track Visibility Agents > Advanced Agents > Collapse All Visible Folders\"."}]}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"323243","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Cubase 13.0.41"},{"name":"headline","type":"h3","content":"What's new?"},{"name":"text","type":"regular","content":"June 13, 2024 – The Cubase 13.0.41 hotfix is now available. This update resolves an issue with MixConsole that caused the application to close unexpectedly when using the Wave-Meter."},{"name":"text","type":"regular","content":"The update is immediately available for download via the Steinberg Download Assistant."}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"307685","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Cubase 13.0.40"},{"name":"headline","type":"h3","content":"What’s new?"},{"name":"text","type":"regular","content":"May 28, 2024 – The Cubase 13.0.40 maintenance update is now available. The update introduces many fixes and improvements in several areas of the application."},{"name":"text","type":"regular","content":"The update is immediately available for download via the Steinberg Download Assistant."},{"name":"headline","type":"h3","content":"We have improved the following features and functionalities."},{"name":"text","type":"question","content":"Miscellaneous"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Selecting a track in the editor Visibility list when a part from another track is selected in the editor is now working as expected."},{"name":"text","type":"normal","content":"The Color tool on macOS now works as expected."},{"name":"text","type":"normal","content":"We have improved the behaviour of using Audio Extensions (ARA) on tracks with Auto Monitoring set to \"Tapemachine Style\"."},{"name":"text","type":"normal","content":"NRPN MIDI messages are now processed as expected on macOS systems."},{"name":"text","type":"normal","content":"The process \"Detect Silence\" now works as expected with a multiple selection of events."},{"name":"text","type":"normal","content":"The Project window is now set to front as expected when coming back to it from another application (Windows only)."},{"name":"text","type":"normal","content":"The instrument return channel selection for MIDI tracks connected to Rack Instruments and placed in folder tracks is now handled correctly."},{"name":"text","type":"normal","content":"The Audio Panner in the Track Inspector is now working as expected after activating a deactivated track."},{"name":"text","type":"normal","content":"\"Reload Track Preset\" function is available again in the Track Inspector > Basics section > Track Preset menu."},{"name":"text","type":"normal","content":"File locations within the Track Preset browser can be selected properly now."},{"name":"text","type":"normal","content":"Transposing a selection of note events in the List Editor now works as expected."},{"name":"text","type":"normal","content":"MIDI Remote devices that were switched on after starting the application now connect correctly to the MIDI input (via \"Windows MIDI\" ports)."},{"name":"text","type":"normal","content":"(Un)-Muting a combination of nested folder tracks with group tracks involved has been improved."},{"name":"text","type":"normal","content":"The currently selected track is now immediately shown in the Visibility list when opening the track Visibility tab."},{"name":"text","type":"normal","content":"The Score Settings window can be now opened properly when working with Score Editor in separate window (only affects Cubase Artist, Elements, AI, LE)."},{"name":"text","type":"normal","content":"Editing operations on folder parts (e.g. moving) with an active tempo track are now applied as expected to the actual events in the folder."},{"name":"text","type":"normal","content":"Importing Tempo Track data via .smt files now works correctly again."},{"name":"text","type":"normal","content":"Preference > Transport > \"Timecode Input Scheme\" is now properly applied when entering time code values."},{"name":"text","type":"normal","content":"\"Start from Selection Start\" now working as expected in conjunction with the \"Divide Track List\" function."},{"name":"text","type":"normal","content":"The user interface controls (e.g. Solo/Mute buttons) can now be operated properly e.g. after performing an Audio Export, resp. a progress bar window was shown."},{"name":"text","type":"normal","content":"All checkboxes can now be operated in Preferences > Event Display > Chords & Pitches as expected."},{"name":"text","type":"normal","content":"We have improved the estimation of file size and handling when exporting a video to a drive with not enough available disc space."},{"name":"text","type":"normal","content":"Audio files added to project via \"Soundly\" will now be placed correctly at Range Start, resp. the current Range Cursor position."}]},{"name":"text","type":"question","content":"MixConsole"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Solo/Mute for a multiple selection of channels can be now engaged properly with Shift+Alt/Option modifier key."},{"name":"text","type":"normal","content":"The fader area in the MixConsole windows can be fully increased vertically again over other sections above."},{"name":"text","type":"normal","content":"Exclusive mode for the \"Listen\" functionality has been restored as in version 12."},{"name":"text","type":"normal","content":"Editing the EQ settings via pop-up window when Quick Link is enabled is now applied properly to all selected channels."},{"name":"text","type":"normal","content":"The option to \"Expand Sections Exclusively\" is now applied consistently across all MixConsole windows."},{"name":"text","type":"normal","content":"Cubase LE, AI and Elements display the Volume Fader caps with different default colors for the individual track types again."},{"name":"text","type":"normal","content":"The gain reduction display in the meter bridge of the MixConsole now responds immediately after enabling compressor modules in the Channel Strip section."}]},{"name":"text","type":"question","content":"Stability"},{"name":"text","type":"question","content":"We have improved the stability for the following operations:"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"When attempting to slice and quantize multiple events at once."},{"name":"text","type":"normal","content":"When removing (or disabling) instrument tracks while the fader section in the Inspector is visible."},{"name":"text","type":"normal","content":"When attempting to start an Audio Export, resp. while an Audio Export was running."},{"name":"text","type":"normal","content":"When using Logical Editor setups involving the context variable \"Highest Note\"."},{"name":"text","type":"normal","content":"When using \"Create Markers from Events\" function."},{"name":"text","type":"normal","content":"When searching the MediaBay with specific characters."},{"name":"text","type":"normal","content":"When Deck Link cards are involved in the Studio Setup > Video section."},{"name":"text","type":"normal","content":"When importing track archives containing video tracks."},{"name":"text","type":"normal","content":"When importing audio files with very low sample rates (and no conversion to project sample rate)."}]}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"295987","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Cubase 13.0.30"},{"name":"headline","type":"h3","content":"What’s new?"},{"name":"text","type":"regular","content":"March 20, 2024 – The Cubase 13.0.30 maintenance update is now available. The update introduces many fixes and improvements in several areas of the application. Instantly noticeable are the improvements to the user interface. We have carefully analyzed the user feedback after the release and made several refinements, mostly in the MixConsole and the Project window. Another major improvement is the change to the project file format which now allows file sizes of more than 2GB."},{"name":"headline","type":"h3","content":"User interface improvements"},{"name":"text","type":"regular","content":"13.0.30 introduces further user interface refinements that improve readability and the overall look and feel in several areas."},{"name":"text","type":"regular","content":"Most of the refinements can be found in the MixConsole and in the track list of the Project window. You will notice that we have reduced the brightness of the white font, icons, and other elements to lower the contrast on dark backgrounds. We have refined the visual appearance of several elements to streamline the user interface and improve the usability when highlighting selected tracks or channels. The inversion of text and icon colors is now more consistent."},{"name":"text","type":"regular","content":"There is also a new option \"Track Name Font Weight\" in the Event Display > Tracks page of the Preferences dialog that allows you to select between \"bold\" and \"regular\" font weight for the track name in the track list of the Project window. We have kept \"bold\" as the default for now, but please give the \"regular\" setting a try and let us know what you think."},{"name":"headline","type":"h3","content":"Changes to the project file format"},{"name":"text","type":"regular","content":"The original specifications of the Cubase and Nuendo project file format (*.cpr and *.npr) were not conceived for project files larger than 2 GB. As a result of technical progress, such as ARA support, and of an increased complexity of VST plug-ins, more and more data was stored in the project files by the plug-ins, causing an increase of the file size. Unfortunately, project files that exceeded the size of 2 GB may have gotten corrupted when saved. In practice, the issue occurred just rarely."},{"name":"text","type":"regular","content":"With Cubase 13.0.30 we introduce a change to the project file format to support much larger file sizes. Cubase will now detect automatically whether to use the previous (32-bit) format or the new (64-bit) project file format. When the project file size requires the 64-bit format to be used, you will be informed via a dialogue."},{"name":"text","type":"regular","content":"64-bit project files will be only be compatible with Cubase 13.0.30 or higher. It will not be possible to open 64-bit projects in earlier versions (i.e. 13.0.20) or generations (i.e. Cubase 12). Once a project file is saved in 64-bit format it cannot be converted back to 32-bit."},{"name":"text","type":"regular","content":"You can find more details and tips to reduce the project file size here: [link href=\"https://helpcenter.steinberg.de/hc/en-us/articles/16605644390546-Cubase-Nuendo-Invalid-project-after-saving\" target=\"_self\" url-fragment=\"\" seoTitle=\"\" follow=\"follow\"]https://helpcenter.steinberg.de/hc/en-us/articles/16605644390546-Cubase-Nuendo-Invalid-project-after-saving[/link]"},{"name":"headline","type":"h3","content":"We have improved the following features and functionality"},{"name":"text","type":"question","content":"Editing"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Zooming while playback does no longer cause undesired scroll position jumps."},{"name":"text","type":"normal","content":"Audio Quantize using phase-coherent warp is now applied immediately"},{"name":"text","type":"normal","content":"Audio events no longer get silent after VariAudio editing."}]},{"name":"text","type":"question","content":"Track Import"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Tempo tracks and signature tracks can now only be imported when the target project transport is in \" Bars and Beats\" mode."},{"name":"text","type":"normal","content":"The track import function now supports range import of a signature track."},{"name":"text","type":"normal","content":"The track import function now supports range import of a tempo track."}]},{"name":"text","type":"question","content":"Miscellanous"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"On Windows, the Hub now provides a dedicated Quit button for closing the program"},{"name":"text","type":"normal","content":"A MIDI track routed to a VST instrument now shows both the audio return volume fader and the MIDI volume fader in the Track Inspector."},{"name":"text","type":"normal","content":"The \"Fixed number of slots\" option has been removed from the MixConsole Functions menu and replaced by the \"Show all available Slots for…\" in the context menus of the Inserts, Sends, Cue Sends, Direct Routing, and Quick Controls sections in the MixConsole, the Track and the Channel Inspector. The settings are stored globally and are also used for linked MixConsoles. For the Lower Zone MixConsole, the option is always active."},{"name":"text","type":"normal","content":"Cubase now supports the MPE MIDI Device \"Expressive E Osmose\" as Note Expression Input Device."},{"name":"text","type":"normal","content":"Cubase can now retrieve the Origin Time from .wav files with embedded markers that are written by Wavelab."},{"name":"text","type":"normal","content":"VST Instruments now play correctly when sending note events with a velocity value of \"1\"."},{"name":"text","type":"normal","content":"Device Panels now work correctly on Instrument tracks."},{"name":"text","type":"normal","content":"On Mac OS, the Direct Offline Processing window is now resizing correctly when selecting plug-ins in the process list, or when selecting different clips."},{"name":"text","type":"normal","content":"Reordering attributes in the result area of the Naming Scheme dialog now works as expected."},{"name":"text","type":"normal","content":"Project folders created by the user are kept when closing a project without saving."},{"name":"text","type":"normal","content":"Freezing of several tracks works as expected, even if one of the tracks has no events."},{"name":"text","type":"normal","content":"User Pattern Banks for \"Beat Designer\" can be now properly browsed and loaded."},{"name":"text","type":"normal","content":"The result list in the Media Rack now retains its key navigation focus when controlling something in the preview section (e.g. volume)."},{"name":"text","type":"normal","content":"We have improved the handling for selecting Audio Click Outputs in the Metronome Setup window."},{"name":"text","type":"normal","content":"Already existing MIDI CCs recorded in \"Step\" mode are no longer reduced when recorded in \"Ramp\" mode later."},{"name":"text","type":"normal","content":"Changing amp models in the \"AmpSimulator\" plug-in now works correctly."},{"name":"text","type":"normal","content":"The VST MultiPanner can now be controlled from EuCon-based control surfaces."},{"name":"text","type":"normal","content":"We have improved the handling of sections when selecting specific tools via key commands and \"Expand Sections Exclusively\" is enabled in the Sample Editor."},{"name":"text","type":"normal","content":"The \"Input Transformer\" is now available for sampler tracks."}]},{"name":"text","type":"question","content":"MixConsole"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"The Pre/Post Fader divider for the Inserts section can now be moved again behind the last visible slot."},{"name":"text","type":"normal","content":"The \"Show CR in Master\" and \"Show CR in Loudness\" state is now remembered and always reset to off when tabs have been switched in the Control Room."},{"name":"text","type":"normal","content":"Entering values for track \"Volume\" parameters on tracks connected to VCA Faders now works as expected."},{"name":"text","type":"normal","content":"Option for \"Always On Top\" is now back in the Channel Settings window."},{"name":"text","type":"normal","content":"Track/Channel \"Solo exclusive\" mode now works as expected."}]},{"name":"text","type":"question","content":"User interface"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"We have improved the visual status indication for Track Control \"Switch time base between Musical and Linear\"."},{"name":"text","type":"normal","content":"Selecting a multi-out instrument return in the track list now correctly updates the Channel Inspector to show the specific return channel instead of the main instrument channel."},{"name":"text","type":"normal","content":"The \"Edit Instruments\" button can now also close an opened VST Instrument window."},{"name":"text","type":"normal","content":"The name font of folder tracks now inverts its color in selection state correctly."},{"name":"text","type":"normal","content":"shortened to show the most important part if there is not enough space to display the entire name."},{"name":"text","type":"normal","content":"We fixed a user interface layout issue in the Metronome Setup dialog."},{"name":"text","type":"normal","content":"The Stereo Panner in the Fader section is now expanding in height as in previous versions."},{"name":"text","type":"normal","content":"We have increased the font size in the result lists of the MediaBay."}]},{"name":"text","type":"question","content":"Stability"},{"name":"text","type":"regular","content":"We have improved the stability in the following areas:"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"when loading projects from former Cubase versions like e.g. Cubase 12"},{"name":"text","type":"normal","content":"when attempting to open \"Time Stretch\" as Direct Offline Process"},{"name":"text","type":"normal","content":"when undoing Audio Warp editing"},{"name":"text","type":"normal","content":"when performing repeated Audio Warp editing"},{"name":"text","type":"normal","content":"when attempting to use \"Render In Place\" on tracks with the RoomWorks plug-in inserted"},{"name":"text","type":"normal","content":"when using the Export Audio Mixdown function and overwriting an already existing audio file"},{"name":"text","type":"normal","content":"when using VST System Link"},{"name":"text","type":"normal","content":"when recording SysEx data from external MIDI devices"},{"name":"text","type":"normal","content":"when using the \"Reset Layout\" under Window > Windows > Reset Layout"}]}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"286543","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Cubase 13.0.21"},{"name":"headline","type":"h3","content":"What's new?"},{"name":"text","type":"regular","content":"January 25, 2024 – This Windows-only update resolves several issues that could lead to graphic glitches on Windows systems. Although these issues only occur on specific hardware configurations, we recommend all Windows users to install the update."},{"name":"text","type":"regular","content":"The update is immediately available via the Steinberg Download Assistant."}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"282746","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Cubase 13.0.20"},{"name":"headline","type":"h3","content":"What's new?"},{"name":"text","type":"regular","content":"December 12, 2023 – The Cubase 13.0.20 maintenance update is now available. With this maintenance update we are integrating many improvements and a long list of fixes and corrections in numerous areas of the application. "},{"name":"text","type":"regular","content":"The update is immediately available for download via the Steinberg Download Assistant. "},{"name":"text","type":"regular","content":"With the release of 13.0.20, we also made the Cubase 13 trial available. As of now, Cubase Elements 13 and Cubase Pro 13 can be tested for free."},{"name":"headline","type":"h3","content":"Graphical issues on Windows"},{"name":"text","type":"regular","content":"Windows systems may still experience GUI glitches that manifest as white UI areas, elements rendered out-of-place, or flickering (e.g., in SuperVision, in Groove Agent SE, or in the Project window during scrolling)."},{"name":"text","type":"regular","content":"We are actively working together with Microsoft to find a comprehensive solution across all systems. Meanwhile, we have identified a workaround in connection with NVIDIA or AMD settings. For detailed instructions, please follow this [link href=\"https://helpcenter.steinberg.de/hc/en-us/articles/15279887297298-Graphical-User-Interface-errors-in-Cubase-13\" target=\"_blank\" url-fragment=\"\" seoTitle=\"Link\" follow=\"follow\"]Link[/link]."},{"name":"headline","type":"h3","content":"Tap Tempo"},{"name":"text","type":"regular","content":"The Tap Tempo feature gets new override options. In the new Tap Tempo Mode pop-up menu you can find the following options:"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Automatic: The same as before (default)."},{"name":"text","type":"normal","content":"Insert tempo event at selection start: Inserts a tempo marker at the start of the current selection, does not do anything if nothing is selected."},{"name":"text","type":"normal","content":"Insert tempo event at last playback start position: Inserts the tempo event at the last playback start position."},{"name":"text","type":"normal","content":"Insert tempo event at cursor position: Inserts a tempo event at the cursor position."},{"name":"text","type":"normal","content":"Set project tempo: Sets the rehearsal tempo if the tempo track is disabled. Otherwise, it changes the initial tempo event of the tempo track."},{"name":"text","type":"normal","content":"Display only: Displays the tapped tempo without applying any tempo changes."}]},{"name":"headline","type":"h3","content":"EQ Pop-up Display"},{"name":"text","type":"regular","content":"The EQ pop-up display in the MixConsole now follows the Equalizer Settings in the Channel Settings window. This affects the following settings:"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"Show Equalizer Controls"},{"name":"text","type":"normal","content":"Show Controls as Sliders"},{"name":"text","type":"normal","content":"Show Controls as Knobs"},{"name":"text","type":"normal","content":"Show FFT Pre EQ Curve"},{"name":"text","type":"normal","content":"Hold FFT Post EQ Peak Curve"},{"name":"text","type":"normal","content":"Transparency for Reference Channel Curve"}]},{"name":"headline","type":"h3","content":"Track name font color"},{"name":"text","type":"regular","content":"The track name font color for the selected track is inverted (to black), when the Selection Brightness setting in the Preferences dialog exceeds a certain threshold."},{"name":"headline","type":"h3","content":"Track Inspector and Channel Tab"},{"name":"text","type":"regular","content":"The Track Inspector and Channel tab headers have now an expand/collapse state indicator."},{"name":"headline","type":"h3","content":"We have also improved the following features and functionalities:"},{"name":"text","type":"question","content":"ARA"},{"name":"text","type":"regular","content":"Switching between ARA extensions in a separate window is now working as expected."},{"name":"text","type":"regular","content":"The Make Extension Permanent function now also works on shared audio events."},{"name":"text","type":"regular","content":"We resolved an issue where ARA extension edits on hidden track versions could be lost when saving and reloading the project."},{"name":"text","type":"question","content":"Direct Offline Processing"},{"name":"text","type":"regular","content":"Using the REVerence plug-in in Direct Offline Processing now works again as expected."},{"name":"text","type":"regular","content":"We resolved an issue where the Normalize and Gain processes did not apply correctly when triggered from favorites."},{"name":"text","type":"regular","content":"We resolved an issue where the progress indicator for Direct Offline Processing would randomly stay in a busy state even after completion."},{"name":"text","type":"regular","content":"Closing the Direct Offline Processing window now works as expected again."},{"name":"text","type":"regular","content":"We resolved an issue where the Open Direct Offline Processing Window button in the toolbar did not work as expected."},{"name":"text","type":"regular","content":"We resolved an issue where using Direct Offline Processing in audition mode did not work as expected."},{"name":"text","type":"regular","content":"We resolved an issue where drag and drop of inserts from the MixConsole and the Channel tab to the Direct Offline Processing window did not work as expected."},{"name":"text","type":"regular","content":"We resolved an issue where offline processes were not functioning in the Sample Editor when Auto Apply was deactivated."},{"name":"text","type":"regular","content":"We resolved an issue where applying offline processes via the Pool did not work as expected."},{"name":"text","type":"question","content":"Editing"},{"name":"text","type":"regular","content":"We resolved an issue where Insert Silence between left and right Locators did not work as expected when the project contained a ruler track."},{"name":"text","type":"regular","content":"We resolved an issue where the GUI for the Detect Silence function would randomly not allow the selection of strip or split options."},{"name":"text","type":"regular","content":"We resolved an issue where Acoustic Feedback did not work as expected when MIDI note Velocity was changed in the info line."},{"name":"text","type":"regular","content":"We resolved an issue where the pitch bend value in the info line did not respond to the Semitone grid setting."},{"name":"text","type":"regular","content":"We resolved an issue where Time Warp anchors in the Time Warp tool were not visible and could not be deleted using Shift + Click."},{"name":"text","type":"regular","content":"We resolved an issue, where the Edit > Range > Insert Silence function did not work as expected when a ruler track was selected."},{"name":"text","type":"regular","content":"The arranger track edit button can now be used to open and close the Arranger Editor window."},{"name":"text","type":"question","content":"Export"},{"name":"text","type":"regular","content":"Resizing the Export Queue area in the Audio Export dialog is now working as expected."},{"name":"text","type":"regular","content":"Exporting an Audio Mixdown now works as expected again."},{"name":"text","type":"regular","content":"We resolved an issue where, when replacing audio in multiple videos simultaneously, all exported files received the same name."},{"name":"text","type":"question","content":"Import"},{"name":"text","type":"regular","content":"We resolved an issue where output routing for sub-channels of existing tracks did not work as expected when using the Import Tracks from Project function."},{"name":"text","type":"regular","content":"We resolved an issue where tracks imported using the Import Tracks from Project function were sometimes silent when only events and parts were selected."},{"name":"text","type":"question","content":"Key Commands"},{"name":"text","type":"regular","content":"We have resolved an issue where key commands could be lost under certain circumstances."},{"name":"text","type":"regular","content":"When renaming a Key Command macro, the macro tree will now be updated to accurately reflect the correct alphabetical position of the new name."},{"name":"text","type":"question","content":"MIDI Remote"},{"name":"text","type":"regular","content":"The Pick for MIDI Remote Mapping function has been restored and is visible again in all designated areas."},{"name":"text","type":"regular","content":"We resolved an issue with MIDI Remote involving the use of relative encoders."},{"name":"text","type":"regular","content":"We have added a new MIDI Remote factory script for the ESI Xjam MIDI controller."},{"name":"text","type":"question","content":"MixConsole"},{"name":"text","type":"regular","content":"The EQ pop-up display in the Channel tab and MixConsole can now be used as expected."},{"name":"text","type":"regular","content":"We resolved an issue where the MixConsole window would appear empty when loading projects from previous versions."},{"name":"text","type":"regular","content":"We resolved an issue where MixConsole zones did not recall correctly when switching between projects."},{"name":"text","type":"regular","content":"We resolved an issue where having an open EQ pop-up display in the Channel tab and MixConsole could potentially disable the transport functions."},{"name":"text","type":"regular","content":"The Show All and Reset All buttons in the MixConsole toolbar setup panel now have an effect on all linked MixConsoles."},{"name":"text","type":"regular","content":"Primary and Secondary Parameters for Increase/Decrease commands are now working as expected in the MixConsole fader area."},{"name":"text","type":"regular","content":"The display of the Routing section in the MixConsole at narrow zoom levels has been optimized."},{"name":"text","type":"regular","content":"The Channel Latency display in the MixConsole has been enhanced for improved visibility when using narrow view settings."},{"name":"text","type":"regular","content":"The setting Preferences > Editing > Project & MixConsole > Scrolling: Disable Mouse Wheel for Parameter Change no longer disables horizontal scrolling for parameter changes."},{"name":"text","type":"question","content":"Miscellaneous"},{"name":"text","type":"regular","content":"Writing automation data for the Frequency 2 and Studio EQ plug-ins and the channel EQ by moving the EQ curve via mouse has been improved."},{"name":"text","type":"regular","content":"Clicking on the name field in the fader area within the output chain of the Channel Settings window now enables channel switching."},{"name":"text","type":"regular","content":"In frozen tracks, Quick Control cells that control a frozen parameter are now shown in a disabled state and can no longer be moved."},{"name":"text","type":"regular","content":"Alt + Click on the VST instrument name in the Inspector Routing section now deactivates the VST Instrument."},{"name":"text","type":"regular","content":"We resolved an issue where newly saved FX Chain Presets, Track Presets, and Strip Presets were not appearing in Load Preset dialogs (macOS only)."},{"name":"text","type":"regular","content":"We resolved an issue where the Add Marker function did not work as expected when using a Mackie Control device."},{"name":"text","type":"regular","content":"Loading projects from earlier versions is again working as expected."},{"name":"text","type":"regular","content":"We resolved an issue where Cycle playback, in conjunction with an arranger track, did not function as expected."},{"name":"text","type":"question","content":"Plug-ins"},{"name":"text","type":"regular","content":"The position of the divider for allowing recording of MIDI inserts is now consistently displayed after reopening a project."},{"name":"text","type":"regular","content":"Entering notes in the MIDI plug-in Chorder can now be used as expected."},{"name":"text","type":"regular","content":"The Frequency 2 plug-in now displays correct Cut Filter parameter values."},{"name":"text","type":"regular","content":"The Renderer for Dolby Atmos plug-in can no longer be mistakenly selected as a panner."},{"name":"text","type":"regular","content":"We resolved an issue where VST3 plug-ins installed in a plug-in path with special unicode characters were not appearing."},{"name":"text","type":"regular","content":"Triggering the Vocoder plug-in with a MIDI keyboard is now working as expected."},{"name":"text","type":"regular","content":"We resolved an issue where the graphics of the AutoPan plug-in were not displayed correctly when using RND1 and RND2."},{"name":"text","type":"regular","content":"We resolved an issue where certain 3rd party plug-in windows had an unusual animation upon opening."},{"name":"text","type":"question","content":"Routing"},{"name":"text","type":"regular","content":"We resolved an issue where MIDI sends displayed an incorrect channel number in the destination pop-up within the MixConsole."},{"name":"text","type":"regular","content":"MIDI Devices created in the MIDI Device Manager are now correctly displayed in MIDI Sends."},{"name":"text","type":"regular","content":"We resolved an issue where changing the device in the MIDI Sends resulted in a reset of the MIDI channel to 1."},{"name":"text","type":"regular","content":"Configuring MIDI end destinations in the MIDI Channel Settings window is again working as expected."},{"name":"text","type":"question","content":"Tracks"},{"name":"text","type":"regular","content":"We resolved an issue where results from the Find Tracks function were not correctly displayed in a divided track list."},{"name":"text","type":"regular","content":"We resolved an issue where certain track types were incorrectly represented by the wrong track color in the Visibility list."},{"name":"text","type":"regular","content":"We resolved an issue where the Visibility list in the Inspector consistently scrolled to the selected track."},{"name":"text","type":"question","content":"User Interface"},{"name":"text","type":"regular","content":"We resolved an issue where the context menu of the timeline ruler was not displayed correctly."},{"name":"text","type":"regular","content":"The List Editor now also has a menu bar."},{"name":"text","type":"regular","content":"The zone controls in editors now have a consistent size."},{"name":"text","type":"regular","content":"When choosing an automation lane, the Channel tab now displays the corresponding content of the parent track."},{"name":"text","type":"regular","content":"The Find Missing Files dialog has been improved."},{"name":"text","type":"regular","content":"Changing the color of Pre-Fader Send and Post-Fader Send cells is now working as expected."},{"name":"text","type":"regular","content":"The Snap to Zero Crossing icon has been optimized."},{"name":"text","type":"question","content":"VariAudio"},{"name":"text","type":"regular","content":"We resolved an issue where VariAudio note segments could become hidden after switching Workspaces."},{"name":"text","type":"regular","content":"Editing VariAudio segments in the Sample Editor is again working as expected."},{"name":"text","type":"question","content":"Video"},{"name":"text","type":"regular","content":"We resolved an issue related to the naming of video files when utilizing Replace Audio in Video for multiple video files."},{"name":"text","type":"regular","content":"The \"Abort\" button in the Replace Audio in Video function is now working as expected."}]}]}]},{"type":"steinberg--text-media","variant":"article","id":"271023","content":[{"name":"columns","children":[{"order":1,"content":[{"name":"headline","type":"h2","content":"Cubase 13"},{"name":"headline","type":"h3","content":"What's new?"},{"name":"text","type":"regular","content":"November 2, 2023 – We are very happy to announce the immediate availability of Cubase 13. You can learn about all the new features and improvements on the [link href=\"https://www.steinberg.net/cubase/\" target=\"_self\" url-fragment=\"\" seoTitle=\"\" follow=\"follow\"]product pages.[/link] There are plenty of tutorials in which our Cubase product specialist Dom Sigalas explains the new functionality in detail and shows you little tricks that can make a big difference.[br][/br]There are a couple of things to be noted, though, and this text serves to give you some information on known issues, discontinued features, the grace period, and more."},{"name":"headline","type":"h3","content":"Grace Period update"},{"name":"text","type":"regular","content":"The Grace Period of Cubase 13 started on August 23, 2023. This means that anyone who has activated a Cubase version since then is eligible for a free update to Cubase 13. You can find details on the process of updating to Cubase 13 within the free Grace Period in our[link href=\"https://helpcenter.steinberg.de/hc/en-us/articles/115001891190-How-to-verify-eligibility-for-free-Grace-Period-update-\" target=\"_self\" url-fragment=\"\" seoTitle=\"\" follow=\"follow\"] Steinberg Helpcenter.[/link]"},{"name":"headline","type":"h3","content":"New demo projects"},{"name":"text","type":"regular","content":"There are two new demo projects available for download via the Steinberg Download Assistant. The first demo project was produced by the one and only Austin Hull and makes intensive use of the new plug-ins, including the VocalChain. If you want to learn how to get the most out of the new plug-ins in Cubase 13, you should check out his project. The second project was produced by Chris Nairn aka AZODi and features the excellent sample pack “Soulful RnB Vocals” by 91Vocals. Be sure not to miss out on this inspirational project!"},{"name":"headline","type":"h3","content":"Hybrid CPU support"},{"name":"text","type":"regular","content":"We have invested a lot of time and effort in optimizing and testing Cubase 13 for hybrid-architecture CPUs, and we are happy to offer full support for both Windows and Mac."},{"name":"headline","type":"h3","content":"Known Issues"},{"name":"list","type":"unordered","children":[{"name":"text","type":"normal","content":"On macOS only, some 3rd-party plug-in windows always open in the upper left area of the primary display, before moving to their actual positions. We will resolve this issue with the next maintenance update."},{"name":"text","type":"normal","content":"On Windows only, unusual graphical artifacts may appear on the user interface under certain circumstances. We will resolve this issue with the next maintenance update."}]},{"name":"headline","type":"h3","content":"Discontinued features and services"},{"name":"headline","type":"h3","content":"Project Browser"},{"name":"text","type":"regular","content":"The Project Browser will be discontinued, as of Cubase 13. Originally designed as a debugging tool for our development, from a technical point of view, it was no longer feasible to maintain the Project Browser with its current design, which is why we decided to invest the time and resources in more popular features of the application."},{"name":"headline","type":"h3","content":"VST Transit"},{"name":"text","type":"regular","content":"After many years of putting our heart, soul, and hard work into VST Transit, as announced earlier this year, this technology will no longer be available. VST Transit is a great technology that brought musicians and producers together. However, it was extremely time-consuming to support and maintain, in order to provide the consistently high level of service that our customers expect and deserve, and unfortunately, the technology reached a point when it was no longer economically viable. We believe in the concept and will assess ways to provide a similar service to our customers again in the future. If you have questions regarding the discontinuation of VST Transit, please contact the Steinberg Support team."}]}]}]},{"type":"steinberg--shop","variant":"","id":"255030","content":[{"productName":"Cubase Pro 15","productFamily":"Cubase 15","productId":"472057","productType":"Software","description":"","descriptionShort":"","image":{"title":"Cubase Pro 15 black","id":"631780","src":[],"name":"image"},"uiStrings":{"shopInfoPlug":"Plug","shopFreeProduct":"Free","bundledWithListedProducts":"Limited bundle with the listed products","shopErrorProductNotFoundMessage":"Please make your choice down below.","shopErrorProductNotFoundHeadline":"Your requested product couldn’t be found","shopMultiUserHeadline":"Multi-User Licences","shopCtaBuyMobile":"Get it","shopInfoShippingCosts":"plus shipping costs","shopInfoBox":"Box","shopProductSize":"Size","shopDiscountInfo":"Get a discount if you own","shopCompetitiveCrossgrade":"Competitive Crossgrade","shopInfoAdToCart":"Add to cart","shopInfoVatFree":"VAT-free","shopHeadlineUpdatesUpgrades":"Updates & upgrades","shopInfoDownload":"Download","shopTilesUpdatePathFrom":"from","bundledWith":"Limited offer with","shopInfoFreeShipping":"Free shipping","shopSublineEducation":"For students & universities","shopInfoUnitPrice":"Unit price","shopQualifiedProducts":"Qualified Products","shopHeadlineEducation":"Education","shopSublineNewCustomers":"For new customers","shopMultiUserAmountInfo":"Minimum order amount: {{amount}} units.","shopInfoVerification":"Proof of eligibility required","shopFullVersion":"Full version","shopFrom":"from","shopInfoRemoveUsbElicenserFromCart":"If you already own one, you can delete it from the shopping cart.","shopVerificationProcess":"Begin verification process","shopCtaTry":"Try","productsListUpdates":"Updates","shopCrossgradeInfo":"Get a discount if you own any of the listed Steinberg-products","productsListCrossgrades":"Crossgrades","shopTilesUpdates":"Updates","shopInfoOutofStock":"Out of stock","shopTilesHighlights":"Highlights","shopMultiUserPriceInfo":"{{amount}} Unit price: ","shopHeadlineLanguages":"Languag
